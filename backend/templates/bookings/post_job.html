{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
    <link rel="stylesheet" href="{% static 'css/bookings/post_job.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">QuranConnect</div>
            <nav class="menu">
                <a href="/">Home</a>
                <a href="#">About us</a>
                <a href="#">AI Tutor</a>
                <a href="#">Contact us</a>
            </nav>
            <div class="profile">👤</div>
        </div>
    </header>

    <main class="page-wrapper">
        <div class="form-container">
            <div class="step-label">Step 1 of 2: Course Details</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <h1>Tell us what you need</h1>

            {% if error %}
                <div class="error-box">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="title">Project Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g need a Hafiz teacher for my 10 year old son"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">What do you want to learn?</label>
                    <select id="course" name="course" required>
                        <option value="Hifz">Hifz</option>
                        <option value="Nazra">Nazra</option>
                        <option value="Tajweed">Tajweed</option>
                        <option value="Qirat">Qirat</option>
                        <option value="Tafsir">Tafsir</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Describe your problem</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="7"
                        placeholder="Make sure that your description is as detailed as possible"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>Tutor Preference</label>
                    <div class="gender-options">
                        <label class="gender-option">
                            <input type="radio" name="preferred_gender" value="Male" required>
                            <span>Male</span>
                        </label>

                        <label class="gender-option">
                            <input type="radio" name="preferred_gender" value="Female" required>
                            <span>Female</span>
                        </label>

                        <label class="gender-option">
                            <input type="radio" name="preferred_gender" value="Any" required>
                            <span>Any</span>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="next-btn">Next</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>

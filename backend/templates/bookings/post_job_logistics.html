{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Step 2</title>
    <link rel="stylesheet" href="{% static 'css/bookings/post_job_logistics.css' %}">
</head>
<body>
{% include 'partials/navbar.html' %}

    <main class="page-wrapper">
        <div class="form-container">
            <div class="step-label">Step 2 of 2: Logistics</div>
            <div class="progress-bar">
                <div class="progress-fill full"></div>
            </div>

            <h1>Schedule Preference</h1>

            {% if error %}
                <div class="error-box">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Preferred Time</label>

                    <div class="two-col">
                        <input
                            type="time"
                            id="start_time"
                            name="start_time"
                            required
                        >

                        <input
                            type="time"
                            id="end_time"
                            name="end_time"
                            required
                        >
                    </div>

                    <div id="time-error" class="error-box" style="display:none;">
                        End time must be later than start time.
                    </div>
                </div>
               
                    <div class="form-group">
                        <label>What is your Budget? (USD)</label>

                        <div class="two-col">
                            <input
                                type="number"
                                name="budget_min"
                                id="budget_min"
                                placeholder="Minimum Budget"
                                min="1"
                                required
                            >

                            <input
                                type="number"
                                name="budget_max"
                                id="budget_max"
                                placeholder="Maximum Budget"
                                min="1"
                                required
                            >
                        </div>

                        <div id="budget-error" class="error-box" style="display:none;">
                            Maximum budget must be greater than or equal to minimum budget.
                        </div>
                    </div>


                <div class="form-actions between">
                    <a href="{% url 'post_job' %}" class="btn-outline">Back</a>
                    <button type="submit" class="next-btn">Submit</button>
                </div>
            </form>
        </div>
    </main>





    <script>
const startTime = document.getElementById("start_time");
const endTime = document.getElementById("end_time");
const form = document.querySelector("form");
const error = document.getElementById("time-error");

function validateTime() {

    if (!startTime.value || !endTime.value) {
        error.style.display = "none";
        return true;
    }

    if (startTime.value >= endTime.value) {
        error.style.display = "block";
        return false;
    }

    error.style.display = "none";
    return true;
}

startTime.addEventListener("change", validateTime);
endTime.addEventListener("change", validateTime);

form.addEventListener("submit", function(e){
    if (!validateTime()) {
        e.preventDefault();
    }
});





const budgetMin = document.getElementById("budget_min");
const budgetMax = document.getElementById("budget_max");
const budgetError = document.getElementById("budget-error");

function validateBudget() {

        if (!budgetMin.value || !budgetMax.value) {
            budgetError.style.display = "none";
            return true;
        }

        if (parseFloat(budgetMin.value) > parseFloat(budgetMax.value)) {
            budgetError.style.display = "block";
            return false;
        }

        budgetError.style.display = "none";
        return true;
    }

    budgetMin.addEventListener("input", validateBudget);
    budgetMax.addEventListener("input", validateBudget);

    form.addEventListener("submit", function(e) {
        if (!validateBudget()) {
            e.preventDefault();
        }
});

</script>



</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Join QuranConnect</title>
    <link rel="stylesheet" href="{% static 'css/users/register_choice.css' %}">
</head>
<body>

<div class="page-wrapper">

    <!-- Logo -->
    <h1 class="logo">QuranConnect</h1>

    <!-- Heading -->
    <h2 class="title">Join Quran Connect</h2>
    <p class="subtitle">
        To get started, please tell us how you want to use the platform
    </p>

    <!-- Options -->
    <div class="options">

        <a href="{% url 'user_signup' 'student' %}" class="option-card">
            <div class="icon">📖</div>
            <p>I want to Learn</p>
        </a>

        <a href="{% url 'user_signup' 'tutor' %}" class="option-card">
            <div class="icon">🕌</div>
            <p>I want to Teach</p>
        </a>

    </div>

    <!-- Continue Button (Optional UI Only) -->
    {% comment %} <div class="continue-section">
        <button class="continue-btn" disabled>Continue</button>
    </div> {% endcomment %}

</div>

</body>
</html>

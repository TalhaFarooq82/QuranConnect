{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent - QuranConnect</title>
    <link rel="stylesheet" href="{% static 'css/users/login.css' %}">
</head>
<body>
<div class="login-container">
    <div class="login-left">
        <div class="login-left-text">
            <h2>Check Your Email</h2>
            <p>A password reset link has been sent to your email.</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-card">
            <h2>QuranConnect</h2>
            <h3>Email Sent ✅</h3>
            <p>We've sent a password reset link to your email address. Please check your inbox and spam folder.</p>
            <br>
            <a href="{% url 'login' %}" class="login-btn" style="display:block; text-align:center; text-decoration:none;">
                Back to Login
            </a>
        </div>
    </div>
</div>
</body>
</html>

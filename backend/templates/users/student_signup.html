<!DOCTYPE html>
<html>
<head>
    <title>Student Signup</title>
</head>
<body>

<div class="signup-container">

    <h2>Student Registration</h2>

    <form method="POST">
        {% csrf_token %}
        
        <div>
            <label>Username</label>
            {{ form.username }}
        </div>

        <div>
            <label>First Name</label>
            {{ form.first_name }}
        </div>

        <div>
            <label>Last Name</label>
            {{ form.last_name }}
        </div>

        <div>
            <label>Email</label>
            {{ form.email }}
        </div>

        <div>
            <label>Gender</label>
            {{ form.gender }}
        </div>

        <div>
            <label>Password</label>
            {{ form.password1 }}
        </div>

        <div>
            <label>Confirm Password</label>
            {{ form.password2 }}
        </div>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>

{% extends 'base.html' %}
{% block title %}Shared Chat - QuranConnect{% endblock %}
{% block content %}
<div style="width:90%;max-width:980px;margin:30px auto;background:#fff;border:1px solid #e5edf3;border-radius:18px;padding:22px;">
  <h1 style="margin:0 0 12px;font-weight:900;">{{ chat.title }}</h1>
  <p style="color:#6b7280;margin:0 0 16px;">Read-only shared chat.</p>

  {% for m in messages %}
    <div style="padding:12px 14px;border:1px solid #e5edf3;border-radius:14px;margin-bottom:10px;">
      <strong>{{ m.role|title }}</strong>
      <div style="white-space:pre-wrap;margin-top:6px;">{{ m.content }}</div>
    </div>
  {% endfor %}
</div>
{% endblock %}
